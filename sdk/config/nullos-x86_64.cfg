# NullOS Official SDK Compiler Configuration (x86_64 Ring 3)
# Generated for GCC / Clang targeting NullOS x86_64 ELF binaries.

NULLOS_TARGET=x86_64-nullos-elf
NULLOS_ARCH_FLAGS=-march=x86-64 -mtune=generic -mno-red-zone -mcmodel=small
NULLOS_FREESTANDING_FLAGS=-nostdlib -fno-builtin -fno-stack-protector
NULLOS_WARN_FLAGS=-Wall -Wextra -O2
NULLOS_LDFLAGS_STATIC=-m elf_x86_64 -static -nostdlib
NULLOS_LDFLAGS_DYN=-m elf_x86_64 -dynamic-linker /lib/ld.so

