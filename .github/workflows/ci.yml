name: NullOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Headless Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            ovmf \
            mtools \
            parted \
            dosfstools \
            gcc-multilib \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Configure KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo modprobe kvm || true
          sudo modprobe kvm_intel || true
          sudo modprobe kvm_amd || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM acceleration successfully enabled on runner:"
            ls -la /dev/kvm
          else
            echo "KVM device not found, falling back to multi-threaded QEMU TCG"
          fi

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Build Bootloader, Libc, Kernel & Disk Images
        run: ./scripts/build.sh

      - name: Run Headless QEMU Automated Verification
        run: ./scripts/run.sh --headless

      - name: Upload Serial Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: build/serial.log
          if-no-files-found: ignore

