name: NullOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Headless Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-system-arm \
            ovmf \
            qemu-efi-aarch64 \
            mtools \
            parted \
            dosfstools \
            gcc-multilib \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-uefi

      - name: Configure KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo modprobe kvm || true
          sudo modprobe kvm_intel || true
          sudo modprobe kvm_amd || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ] && qemu-system-x86_64 -accel kvm -version > /dev/null 2>&1; then
            echo "KVM acceleration successfully verified and active on runner:"
            ls -la /dev/kvm
          else
            echo "Hardware KVM acceleration not functional on runner, falling back to multi-threaded QEMU TCG"
          fi

      - name: Run Full CI Regression Suite (M41 + M42)
        run: ./scripts/ci_regression.sh

      - name: Upload Serial Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: build/serial.log
          if-no-files-found: ignore

